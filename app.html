 return shell('Settings',`<form class="panel" onsubmit="A.saveProfile(event)"><h2>Profile</h2>${u.photo?`<img src="${u.photo}" alt="" style="width:80px;height:80px;border-radius:50%;object-fit:cover">`:''}<label>Profile photo<input type="file" accept="image/*" onchange="A.userPhoto(this,'#/settings')"></label><div class="grid2">${inp('name','Name')}${inp('title','Title')}${inp('company','Company')}${inp('phone','Phone','tel')}${inp('email','Email (login)','email')}${inp('website','Website')}${inp('booking','Booking link')}${inp('instagram','Instagram')}${inp('x','X')}${inp('linkedin','LinkedIn')}${inp('tiktok','TikTok')}${inp('youtube','YouTube')}<label>Username (in card links)<input name="username" value="${esc(u.username)}" pattern="[a-z0-9\\-]+" required></label></div>
 <h3>Your fields</h3><p class="muted small">Add anything the standard list misses: a second website, a Cash App, a press kit, an assistant's line. Each one can be shown on any card and saves into the receiver's phone with the label you give it.</p>
 ${(u.custom_fields||[]).map(f=>`<div class="row cfrow"><input value="${esc(f.label)}" aria-label="Field name" placeholder="Label" onchange="A.pfSet('${f.id}','label',this.value)"><select aria-label="Type" onchange="A.pfSet('${f.id}','kind',this.value)">${[['url','Link'],['phone','Phone'],['email','Email'],['text','Text']].map(([v,l])=>opt(v,l,f.kind)).join('')}</select><input value="${esc(f.value)}" aria-label="Value" placeholder="Value" onchange="A.pfSet('${f.id}','value',this.value)" style="flex:1;min-width:180px"><button type="button" class="btn danger" onclick="A.pfDel('${f.id}')">Remove</button></div>`).join('')}
 <p><button type="button" class="btn" onclick="A.pfAdd()">Add a field</button></p><button class="btn primary">Save profile</button></form>
 <section class="panel"><h2>Save Contact format</h2><p class="muted small">"Save Contact" on any card downloads a vCard (.vcf) built from that card's visible fields. iPhone opens it directly in Contacts with photo, title, company, phone, email, and each link labeled the way you named it (Website, Instagram, Book a call). Android and desktop import it the same way.</p>${mainCard(u)?`<button class="btn" onclick="modal('<h2>vCard preview</h2><pre>'+esc(vcardOf(mainCard(me())).replace(/PHOTO;[^\r\n]+/,'PHOTO: (embedded image)'))+'</pre>')">Preview my vCard</button>`:''}</section>
 <section class="panel"><h2>Plan and billing</h2><p>Current plan: <b>${L.name}</b></p><label>Switch plan (test mode, no charge)<select onchange="A.plan(this.value)">${opt('free','Free: 1 card, 1 event, 100 contacts, presets only, footer',u.plan)}${opt('pro','Pro: $9.99/mo or $79/yr',u.plan)}${opt('events','Events: $29/mo',u.plan)}${opt('founding','Founding Member: $99 once',u.plan)}</select></label><p>Living Portrait credits: ${u.credits.portrait} <button class="btn" onclick="A.credits()">Add 3 credits (test)</button></p><p class="muted small">Jev usage this month: ${u.jev.used} of ${L.jevCap}. iOS subscriptions go through Apple in-app purchase; web and stickers through Stripe.</p></section>
 <section class="panel"><h2>Appearance</h2><div class="seg">${['auto','light','dark'].map(t=>`<button class="${curTheme()===t?'on':''}" onclick="A.theme('${t}')">${{auto:'Match system',light:'Light',dark:'Dark'}[t]}</button>`).join('')}</div></section>
 <section class="panel"><h2>Notifications</h2>${[['scans','New taps and scans'],['submissions','New intake submissions'],['orders','Sticker order updates'],['digest','Daily digest email']].map(([k,l])=>`<label class="chk" style="display:flex"><input type="checkbox" ${s.notif[k]?'checked':''} onchange="A.notif('${k}',this.checked)">${l}</label>`).join('')}</section>
 <section class="panel"><h2>Connected accounts</h2><p>Google Contacts: ${s.connected.google_contacts?'Connected':'Not connected'} <button class="btn" onclick="A.connect('google_contacts')">${s.connected.google_contacts?'Disconnect':'Connect'}</button></p><p>Google Sheets sync: ${s.connected.google_sheets?'Connected':'Not connected'} <button class="btn" onclick="A.connect('google_sheets')">${s.connected.google_sheets?'Disconnect':'Connect'}</button></p><p class="muted small">Connection toggles are simulated. Real OAuth is Phase 3 and 4.</p></section>
 <section class="panel"><h2>Messaging setup</h2><p>SMS sender registration (A2P 10DLC): <b>${{not_started:'Not started',pending:'Pending review',approved:'Approved (simulated)'}[s.smsReg]}</b></p>${s.smsReg==='not_started'?'<button class="btn" onclick="A.smsReg(\'pending\')">Start registration</button>':s.smsReg==='pending'?'<button class="btn" onclick="A.smsReg(\'approved\')">Simulate approval</button>':''}</section>
 <section class="panel"><h2>Email sending</h2><div class="grid2"><label>Sender name<input value="${esc(s.email.fromName||u.name)}" onchange="A.emailSet('fromName',this.value)"></label><label>Replies go to<input type="email" value="${esc(s.email.replyTo||u.email)}" onchange="A.emailSet('replyTo',this.value)"></label></div><label class="chk"><input type="checkbox" ${s.email.bcc?'checked':''} onchange="A.emailSet('bcc',this.checked)">BCC me on every send by default</label><div class="kv"><span>Sends from</span><b>${esc(sendAs(u))}</b><span>Domain status</span><b>Shared Goldex domain (authenticated in production). Custom domain available later.</b></div></section>
 <section class="panel"><h2>Export</h2><button class="btn" onclick="A.exportContacts()">Export contacts CSV</button><button class="btn" onclick="A.exportSubs()">Export submissions CSV</button></section>
 <section class="panel"><h2>Prototype controls</h2><label>Link domain used in links and QR codes<input value="${esc(s.linkBase)}" onchange="A.linkBase(this.value)"></label><p><a class="btn" href="#/onboarding?step=1" onclick="me().onboarded=false;persist()">Replay onboarding</a><button class="btn" onclick="A.resetDemo()">Reset demo data</button><button class="btn" onclick="A.clearDemo()">Clear demo data (keep account)</button></p></section>
 <section class="panel"><h2>Delete account</h2><p class="muted small">Removes your cards, events, contacts, tags, and messages from this browser.</p><button class="btn danger" onclick="A.deleteAccount()">Delete account</button></section>`,'settings')};

/* ============ PUBLIC (receiver) ============ */
function pubBar(){const u=me();return`<div class="pubbar"><span>Receiver view (public page, no login)</span>${u?'<a href="#/home">Back to dashboard</a>':''}</div>`}
const inactive=m=>`${pubBar()}<main class="pub"><h1>${esc(m||'This card is not available')}</h1><p class="muted">Check the link, or ask the owner for a new one.</p></main>`;
V.pubCard=(un,slug,q)=>{const u=DB.users.find(x=>x.username===un);const c=u&&DB.cards.find(x=>x.user_id===u.id&&x.slug===slug);if(!c||c.status!=='live')return inactive();if(!q.nolog)logScan({card_id:c.id,source:['nfc','qr','link'].includes(q.src)?q.src:'link'});return`${pubBar()}<main class="pub">${cardHTML(c,{public:true})}</main>`};
V.pubQR=(un,slug)=>{const u=DB.users.find(x=>x.username===un);const c=u&&DB.cards.find(x=>x.user_id===u.id&&x.slug===slug);if(!c||c.status!=='live')return inactive();return`${pubBar()}<main class="pub" style="background:#fff;min-height:90vh">${qrCardHTML(c)}</main>`};
V.pubIntake=cid=>{const c=byId('cards',cid);if(!c||c.status!=='live')return inactive();const f=byId('forms',c.intake_form_id);if(!f)return inactive('This card has no intake form yet');return`${pubBar()}<main class="pub"><p><a href="${cardHash(c)}&nolog=1">Back to card</a></p>${intakeFormHTML(f,owner(c),{public:true,cardId:cid})}</main>`};
V.pubTag=id=>{const t=byId('tags',id);if(!t||t.status==='disabled')return render(`${pubBar()}<main class="pub"><h1>This tag is not active</h1></main>`);if(t.status!=='active')t.status='active';const c=cardDest(t);t.scan_count++;t.last_scan_at=nowISO();logScan({tag_id:t.id,card_id:c?c.id:'',event_id:t.points_to?.kind==='event'?t.points_to.id:'',source:'nfc'});if(!c||c.status!=='live')return render(inactive('This tag does not point to a live card yet'));location.replace(`#/p/${owner(c).username}/${c.slug}?src=nfc&nolog=1`)};
/* ============ ACTIONS ============ */
const A={
 /* auth */
 login(e){e.preventDefault();const f=new FormData(e.target);const em=String(f.get('email')).trim().toLowerCase(),pw=String(f.get('password'));const u=DB.users.find(x=>x.email.toLowerCase()===em);if(!u||!(u.password===pw||(u.alt||[]).includes(pw))){toast('Email or password is incorrect.');return}DB.session={userId:u.id};persist();go(u.onboarded?'#/home':'#/onboarding')},
 signup(e){e.preventDefault();const f=new FormData(e.target);const em=String(f.get('email')).trim().toLowerCase();if(DB.users.some(x=>x.email.toLowerCase()===em)){toast('An account with that email exists. Log in instead.');return}let un=slugify(em.split('@')[0])||'user',i=2;const base0=un;while(DB.users.some(x=>x.username===un))un=base0+i++;const u=newUser({name:String(f.get('name')).trim(),email:em,password:String(f.get('password')),username:un});DB.users.push(u);DB.session={userId:u.id};persist();go('#/onboarding')},
 reset(e){e.preventDefault();toast('If that email has an account, a reset link is on its way (simulated: email service not connected).');setTimeout(()=>go('#/login'),1500)},
 oauth(p){toast(`Sign in with ${p} needs OAuth credentials (Supabase Auth). Use email and password in this prototype.`)},
 logout(){DB.session=null;persist();go('#/login')},
 /* onboarding */
 onb1(e){e.preventDefault();const f=new FormData(e.target),u=me();['name','title','company'].forEach(k=>u[k]=String(f.get(k)).trim());persist();go('#/onboarding?step=2')},
 async userPhoto(inp,back){const file=inp.files[0];if(!file)return;if(file.size>10*1024*1024){toast('Photo must be 10 MB or smaller.');return}try{const u=me();const old=u.photo;u.photo=await readImage(file,400,true);DB.cards.filter(c=>c.user_id===u.id&&(!c.photo_url||c.photo_url===old)).forEach(c=>c.photo_url=u.photo);persist();route()}catch(err){toast(err.message)}},
 onbCard(){const u=me();let c=DB.cards.find(x=>x.user_id===u.id);if(!c||mine('cards').length<limits(u).cards){c=newCard(u,{name:'My first card'});DB.cards.push(c);persist()}go(`#/cards/${c.id}/edit?step=1&from=onb`)},
 finishOnb(keep){me().onboarded=true;persist();if(!keep)go('#/home')},
 /* card builder */
 pv(id){const c=byId('cards',id),el=$('#preview');if(el&&c){el.innerHTML=cardHTML(c);hydrate(el)}},
 cset(id,path,val,full){const c=byId('cards',id);const ks=path.split('.');let o=c;while(ks.length>1)o=o[ks.shift()];o[ks[0]]=val;persist();full?route():A.pv(id)},
 ctype(id,t){const c=byId('cards',id);c.type=t;if(TYPE_DEFAULTS[t])c.fields_shown=[...TYPE_DEFAULTS[t]];if(t==='Event'){const b=c.buttons.find(b=>b.kind==='intake');if(b)b.on=true}persist();route()},
 async cardPhoto(inp,id){const file=inp.files[0];if(!file)return;if(file.size>10*1024*1024){toast('Photo must be 10 MB or smaller.');return}try{const c=byId('cards',id);c.photo_url=await readImage(file,400,true);c.portrait={generated:false,approved:false};if(!me().photo)me().photo=c.photo_url;persist();route()}catch(err){toast(err.message)}},
 cbg(id,bg,full=1){byId('cards',id).bg=bg;persist();full?route():A.pv(id)},
 async bgUpload(inp,id){const file=inp.files[0];if(!file)return;const u=me();try{if(/^image\/(jpeg|png)$/.test(file.type)){if(file.size>10*1024*1024)throw new Error('Images must be 10 MB or smaller.');const url=await readImage(file,1080,false);const up={id:'b_'+rid(),name:file.name,type:'image',url,is_preset:false,owner_id:u.id};DB.uploads.push(up);byId('cards',id).bg={kind:'upload',id:up.id}}else if(file.type==='video/mp4'){if(file.size>15*1024*1024)throw new Error('Video loops must be 15 MB or smaller.');const d=await videoDuration(file);if(!(d<=10.5))throw new Error(isNaN(d)?'Could not read the video.':`Video is ${d.toFixed(1)} seconds. The limit is 10 seconds.`);const up={id:'b_'+rid(),name:file.name,type:'video_loop',url:'',is_preset:false,owner_id:u.id};await IDB.put(up.id,file);DB.uploads.push(up);byId('cards',id).bg={kind:'upload',id:up.id}}else throw new Error('Use JPG, PNG, or MP4.');persist();route()}catch(err){toast(err.message)}},
 portraitGen(id){const c=byId('cards',id),u=me();if(u.credits.portrait<1){toast('No Living Portrait credits left.');return}u.credits.portrait--;c.portrait={generated:true,approved:false,at:nowISO()};persist();toast('Living Portrait generated (simulated). Review and approve before publishing.');route()},
 portraitApprove(id,v){byId('cards',id).portrait.approved=v;persist();A.pv(id)},
 cfield(id,k,on){const c=byId('cards',id);c.fields_shown=on?[...new Set([...c.fields_shown,k])]:c.fields_shown.filter(x=>x!==k);persist();A.pv(id)},
 uval(k,v,id){me()[k]=v;persist();A.pv(id)},
 clink(id,i,k,v){byId('cards',id).custom_links[i][k]=v;persist();A.pv(id)},
 clinkAdd(id){byId('cards',id).custom_links.push({label:'',url:''});persist();route()},
 clinkDel(id,i){byId('cards',id).custom_links.splice(i,1);persist();route()},
 bset(id,i,k,v,full){byId('cards',id).buttons[i][k]=v;persist();full?route():A.pv(id)},
 bmove(id,i,d){const b=byId('cards',id).buttons;const j=i+d;if(j<0||j>=b.length)return;[b[i],b[j]]=[b[j],b[i]];persist();route()},
 btnDrop(e,id,to){e.preventDefault();const from=+e.dataTransfer.getData('text/plain');const b=byId('cards',id).buttons;const[x]=b.splice(from,1);b.splice(to,0,x);persist();route()},
 baddCustom(id){byId('cards',id).buttons.push({id:rid(5),kind:'custom',label:'',url:'',on:true});persist();route()},
 standaloneForm(id){const f=newForm(me(),null);DB.forms.push(f);const c=byId('cards',id);c.intake_form_id=f.id;const b=c.buttons.find(b=>b.kind==='intake');if(b)b.on=true;persist();go(`#/forms/${f.id}?back=${encodeURIComponent('#/cards/'+id+'/edit?step=7')}`)},
 draft(id){persist();toast('Draft saved');},
 publish(id,from){const c=byId('cards',id),u=me();const s=slugify($('#slug').value);if(!s){toast('Enter a link slug using letters, numbers, and dashes.');return}if(DB.cards.some(x=>x.user_id===u.id&&x.slug===s&&x.id!==id)){toast('You already use that slug on another card.');return}
  if(c.dynamic&&c.background_effect==='portrait'&&limits(u).effects&&!(c.portrait.generated&&c.portrait.approved)){toast('Generate and approve the Living Portrait (step 4), or pick another effect.');return}
  if(c.buttons.some(b=>b.kind==='intake'&&b.on)&&!c.intake_form_id){toast('The intake button is on but no form is attached (step 7).');return}
  c.slug=s;c.status='live';c.qr_url=cardUrl(c)+'?src=qr';persist();toast('Published');go(from==='onb'?`#/onboarding?step=4&card=${id}`:`#/cards/${id}`)},
 unpublish(id){byId('cards',id).status='draft';persist();toast('Unpublished. The link and tags now show "not available".');route()},
 dupCard(id){const u=me();if(mine('cards').length>=limits(u).cards){toast('Card limit reached on this plan.');return}const c=JSON.parse(JSON.stringify(byId('cards',id)));c.id='c_'+rid();c.name+=' (copy)';c.slug='';c.status='draft';c.created_at=nowISO();c.saves=0;DB.cards.push(c);persist();go(`#/cards/${c.id}/edit?step=1`)},
 delCard(id){if(!confirm('Delete this card? Tags pointing to it will show "not available" until re-aimed.'))return;DB.cards=DB.cards.filter(c=>c.id!==id);DB.events.forEach(e=>e.card_ids=e.card_ids.filter(x=>x!==id));persist();go('#/cards')},
 share(url,name){if(navigator.share)navigator.share({title:name+' on Goldex',url}).catch(()=>{});else copyText(url)},
 async qrPng(id){const c=byId('cards',id);const url=qrDataURL(cardUrl(c)+'?src=qr',1000);const b=await (await fetch(url)).blob();saveFile(`goldex-qr-${c.slug||c.id}.png`,b)},
 qrPdf(id){const c=byId('cards',id);if(!window.jspdf){toast('PDF library did not load.');return}const d=new jspdf.jsPDF({unit:'pt',format:'letter'});d.addImage(qrDataURL(cardUrl(c)+'?src=qr',1000),'PNG',131,160,350,350);d.setFontSize(18);d.text(owner(c).name||'',306,120,{align:'center'});d.setFontSize(11);d.text(cardUrl(c),306,540,{align:'center'});saveFile(`goldex-qr-${c.slug||c.id}.pdf`,d.output('blob'))},
 qrFull(id){const c=byId('cards',id);modal(`<div class="qr" data-qr="${esc(cardUrl(c)+'?src=qr')}" data-size="${Math.min(innerWidth,innerHeight)-120}"></div><p>${esc(owner(c).name)}</p>`,'full')},
 async qrCardCanvas(c){const u=owner(c),W=1200,H=1700;const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.textAlign='center';
  if(c.photo_url){try{const img=await loadImg(c.photo_url);x.save();x.beginPath();x.arc(W/2,250,150,0,Math.PI*2);x.clip();x.drawImage(img,W/2-150,100,300,300);x.restore()}catch(e){}}
  x.fillStyle='#111';x.font='bold 72px system-ui,sans-serif';x.fillText(u.name||'',W/2,500);x.fillStyle='#555';x.font='42px system-ui,sans-serif';x.fillText([u.title,u.company].filter(Boolean).join(', '),W/2,570);
  const q=await loadImg(qrDataURL(cardUrl(c)+'?src=qr',900));x.drawImage(q,175,640,850,850);x.font='36px system-ui,sans-serif';x.fillText('Scan to open my card',W/2,1580);return cv},
 async qrCardPng(id){const c=byId('cards',id);const cv=await A.qrCardCanvas(c);saveFile(`goldex-qrcard-${c.slug||c.id}.png`,await canvasBlob(cv))},
 async qrCardPdf(id){const c=byId('cards',id);if(!window.jspdf){toast('PDF library did not load.');return}const cv=await A.qrCardCanvas(c);const d=new jspdf.jsPDF({unit:'pt',format:'letter'});d.addImage(cv.toDataURL('image/png'),'PNG',126,36,360,510);saveFile(`goldex-qrcard-${c.slug||c.id}.pdf`,d.output('blob'))},
 async saveVcf(id){const c=byId('cards',id);c.saves=(c.saves||0)+1;persist();const v=vcardOf(c);const fn=slugify(owner(c).name)||'contact';
  if(!DL){saveFile(fn+'.vcf',new Blob([v],{type:'text/vcard'}));return}
  modal(`<h2>Save Contact</h2><p>This preview viewer blocks .vcf downloads. On the GitHub or Vercel deployment this button downloads the .vcf directly and the phone opens it in Contacts.</p><p><button class="btn primary" onclick="saveFile('${fn}.txt',vcardOf(byId('cards','${id}')))">Download as .txt (rename to .vcf)</button></p><details><summary>vCard contents</summary><pre>${esc(v.replace(/PHOTO;[^\r\n]+/,'PHOTO: (embedded image)'))}</pre></details>`)},
 /* NFC */
 async writeTag(kind,id){const u=me();const t={id:rid(5),user_id:u.id,order_id:'',uid:'',label:'My own sticker',points_to:kind?{kind,id}:(mainCard(u)?{kind:'card',id:mainCard(u).id}:null),status:'active',scan_count:0,last_scan_at:'',source:'own'};const url=tagUrl(t);
  if('NDEFReader' in window){try{toast('Hold a blank sticker to the back of your phone...');await new NDEFReader().write({records:[{recordType:'url',data:url}]});DB.tags.push(t);persist();toast('Sticker written. Tag '+t.id+' is active.');route()}catch(e){toast('Write failed: '+e.message)}return}
  modal(`<h2>Write to my own sticker</h2><p>This browser cannot write NFC (iOS Safari and desktop browsers block it). The iOS app writes stickers through Core NFC; Chrome on Android can write from this page.</p><p>To test now, create the tag record and write this link with any NFC writer app:</p><pre>${esc(url)}</pre><button class="btn primary" onclick="A.createOwnTag(${esc(JSON.stringify(JSON.stringify(t)))})">Create tag record</button>`)},
 createOwnTag(json){const t=JSON.parse(json);DB.tags.push(t);persist();closeModal();toast('Tag '+t.id+' created and active');go('#/tags/'+t.id)},
 claim(){const id=prompt('Enter the tag ID printed on the sticker packaging (or tap the tag):');if(!id)return;const t=DB.tags.find(x=>x.id===id.trim());if(!t||t.user_id!==me().id){toast('No tag with that ID belongs to your orders.');return}if(t.status==='active'){toast('That tag is already active.');return}if(!['delivered','shipped','encoded'].includes(t.status)){toast('That tag has not shipped yet.');return}t.status='active';persist();toast('Tag claimed and active');route()},

 fval(id,k,v){const c=byId('cards',id);if(c.overrides&&c.overrides[k]!==undefined)c.overrides[k]=v;else me()[k]=v;persist();A.pv(id)},
 cov(id,k,on){const c=byId('cards',id);c.overrides=c.overrides||{};if(on)c.overrides[k]=me()[k]||'';else delete c.overrides[k];persist();route()},
 theme(t){try{localStorage.setItem('goldex_theme',t)}catch(e){}applyTheme();route()},
 /* settings */
 saveProfile(e){e.preventDefault();const f=new FormData(e.target),u=me();const un=slugify(f.get('username'));if(DB.users.some(x=>x.username===un&&x.id!==u.id)){toast('That username is taken.');return}const em=String(f.get('email')).trim().toLowerCase();if(DB.users.some(x=>x.email.toLowerCase()===em&&x.id!==u.id)){toast('That email belongs to another account.');return}['name','title','company','phone','website','booking','instagram','x','linkedin','tiktok','youtube'].forEach(k=>u[k]=String(f.get(k)||'').trim());u.email=em;u.username=un;persist();toast('Profile saved');route()},
 plan(p){me().plan=p;persist();toast('Plan set to '+limits(me()).name+' (test mode)');route()},
 credits(){me().credits.portrait+=3;persist();route()},
 notif(k,v){me().settings.notif[k]=v;persist()},
 connect(k){const s=me().settings.connected;s[k]=!s[k];persist();route()},
 smsReg(v){me().settings.smsReg=v;persist();route()},
 linkBase(v){me().settings.linkBase=v.trim()||'https://goldex.link';persist();toast('Link domain updated')},
 exportContacts(){const rows=[['name','phone','email','socials','website','city','state','roles','events_met','rating','cost_tier','relationship_tier','birthday','notes','source','consent_status','created_at']];mine('contacts').forEach(c=>rows.push([c.name,c.phone,c.email,c.socials,c.website,c.city,c.state,c.roles,c.events_met.map(id=>byId('events',id)?.name||id),c.rating,c.cost_tier,c.relationship_tier,c.birthday,c.notes,c.source,c.consent_status,c.created_at]));saveFile('goldex-contacts.csv',csvOf(rows))},
 exportSubs(){const rows=[['card','event','name','phone','email','roles','note','consent','consent_timestamp','created_at']];mySubs().forEach(s=>rows.push([byId('cards',s.card_id)?.name,byId('events',s.event_id)?.name||'',s.name,s.phone,s.email,s.roles,s.note,s.consent?'yes':'no',s.consent_timestamp,s.created_at]));saveFile('goldex-submissions.csv',csvOf(rows))},
 resetDemo(){if(!confirm('Reset all data in this browser to the demo state?'))return;const s=DB.session;DB=seed();DB.session=s&&DB.users.some(u=>u.id===s.userId)?s:null;persist();go('#/home')},
 clearDemo(){if(!confirm('Remove all cards, events, contacts, tags, orders, and messages for this account?'))return;const id=me().id;['cards','events','forms','contacts','tags','orders','messages','automations','templates','replies'].forEach(k=>DB[k]=DB[k].filter(x=>x.user_id!==id));DB.uploads=DB.uploads.filter(x=>x.owner_id!==id);DB.submissions=DB.submissions.filter(s=>DB.cards.some(c=>c.id===s.card_id));DB.scans=DB.scans.filter(s=>DB.cards.some(c=>c.id===s.card_id)||DB.tags.some(t=>t.id===s.tag_id));DB.seeded=false;persist();go('#/home')},
 deleteAccount(){if(!confirm('Delete this account and all its data from this browser?'))return;A.clearDemoSilent();const id=me().id;DB.users=DB.users.filter(u=>u.id!==id);DB.session=null;persist();go('#/login')},
 clearDemoSilent(){const id=me().id;['cards','events','forms','contacts','tags','orders','messages','automations','templates','replies'].forEach(k=>DB[k]=DB[k].filter(x=>x.user_id!==id))}
};
function csvRecs(text){const rows=parseCSV(text);if(!rows.length)return[];const h=rows[0].map(x=>x.trim().toLowerCase());const f=(...ks)=>h.findIndex(x=>ks.includes(x));const hasHeader=h.some(x=>['name','full name','first name','phone','email'].includes(x));const data=hasHeader?rows.slice(1):rows;const iN=hasHeader?f('name','full name','display name'):0,iF=f('first name','given name'),iL=f('last name','family name'),iP=hasHeader?f('phone','mobile','phone number','mobile phone'):1,iE=hasHeader?f('email','e-mail','email address'):2,iC=f('city'),iS=f('state'),iNo=f('notes','note');
 return data.map(r=>({name:(iN>=0?r[iN]:[r[iF],r[iL]].filter(Boolean).join(' '))||'',phone:iP>=0?r[iP]||'':'',email:iE>=0?r[iE]||'':'',city:iC>=0?r[iC]||'':'',state:iS>=0?r[iS]||'':'',notes:iNo>=0?r[iNo]||'':''})).filter(r=>r.name||r.phone||r.email)}
function vcfRecs(text){return text.replace(/\r\n[ \t]/g,'').split(/BEGIN:VCARD/i).slice(1).map(b=>{const g=re=>{const m=b.match(re);return m?m[1].trim():''};const adr=g(/\nADR[^:]*:([^\r\n]*)/i).split(';');return{name:g(/\nFN[^:]*:([^\r\n]*)/i)||g(/\nN[^:]*:([^\r\n]*)/i).split(';').reverse().filter(Boolean).join(' '),phone:g(/\nTEL[^:]*:([^\r\n]*)/i),email:g(/\nEMAIL[^:]*:([^\r\n]*)/i),city:adr[3]||'',state:adr[4]||'',notes:g(/\nNOTE[^:]*:([^\r\n]*)/i)}}).filter(r=>r.name||r.phone||r.email)}

function applyTheme(){const t=(()=>{try{return localStorage.getItem('goldex_theme')||'auto'}catch(e){return'auto'}})();if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t}
const PORTRAIT_VIDEO='https://d8j0ntlcm91z4.cloudfront.net/user_314g1RuovP9twqNuTM019MiTWLk/hf_20260921_093443_abc94a45-ff73-4c68-a45e-8899d3ac6840.mp4',PORTRAIT_STILL='https://d8j0ntlcm91z4.cloudfront.net/user_314g1RuovP9twqNuTM019MiTWLk/hf_20260921_093349_c78ac3c4-2108-4e29-bcd7-504a0e4d1d2f.png';
function migrate(){if(PORTRAIT_VIDEO){const c=DB.cards.find(x=>x.user_id==='u_amechi'&&x.slug==='main');if(c&&!c.pv_set){c.bg={kind:'video_url',url:PORTRAIT_VIDEO,poster:PORTRAIT_STILL};c.pv_set=true;c.photo_effect='glass';const u=byId('users','u_amechi');if(u&&!u.title)u.title='Operations Confidant'}}DB.users.forEach(u=>{if(!u.custom_fields)u.custom_fields=[];if(u.settings.linkBase==='https://goldex.link')u.settings.linkBase='https://goldex.link';if(!u.cfields.some(f=>f.key==='intake_note'))u.cfields.push({key:'intake_note',label:'Note',type:'text',builtin:true,visible:false,readonly:true});if(!u.cfields)u.cfields=DEFAULT_CFIELDS();if(!u.settings.email)u.settings.email={fromName:'',replyTo:'',bcc:true}});DB.contacts.forEach(c=>{if(c.company==null)c.company='';if(c.customer==null)c.customer=''});DB.cards.forEach(c=>{if(!c.overrides)c.overrides={};if(!c.photo_effect)c.photo_effect='none'})}
(async function boot(){applyTheme();DB=loadDB();if(!DB||!Array.isArray(DB.users)){DB=seed()}migrate();persist();await IDB.open();addEventListener('hashchange',route);addEventListener('storage',e=>{if(e.key===KEY){DB=loadDB()||DB;route()}});processScheduled();setInterval(processScheduled,30000);route()})();
